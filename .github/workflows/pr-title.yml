name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional commit types
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Scope is optional
          requireScope: false
          # The subject (after "type: ") can start with any case
          subjectPattern: ^.+$
          subjectPatternError: >
            The PR title "{title}" doesn't follow conventional commits format.
            Expected: type(scope): description  —  e.g. "feat: Add dark mode"
