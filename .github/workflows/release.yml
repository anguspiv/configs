# NOTE: The "Version Packages" pull request this opens must be merged with
# admin privileges — `gh pr merge <n> --squash --admin`.
#
# GitHub deliberately does not trigger workflows for events created by
# GITHUB_TOKEN, so a bot-authored PR never gets check runs, and required status
# checks on it can never pass. Its mergeState stays BLOCKED forever.
#
# This is accepted rather than worked around. The alternative is a long-lived
# PAT so the PR triggers CI normally, which trades a permanent stored secret for
# a gate on generated version bumps and CHANGELOGs — content CI would not
# meaningfully validate. Branch protection keeps its real value: no force
# pushes, no deletions, and required checks on human PRs.

name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # The repository default is read-only, and changesets/action must be able to
    # push the version commit and open the "Version Packages" pull request.
    permissions:
      contents: write
      pull-requests: write
      id-token: write # for npm provenance, and for OIDC publishing later
    steps:
      - uses: actions/checkout@v5
        with:
          # Required so changesets can push version commits back to the repo
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Create version PR or publish to npm
        uses: changesets/action@v1
        with:
          # When changesets exist: opens/updates a "Version Packages" PR.
          # When that PR is merged: runs this publish script.
          publish: pnpm ci:publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add NPM_TOKEN to your repository secrets:
          # Settings → Secrets → Actions → New repository secret
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
